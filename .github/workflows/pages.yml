name: Deploy Empire to GitHub Pages

on:
  push:
    branches:
      - claude/empire-word-game-app-2qfe13
      - main
    paths:
      - "empire/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages (enables Pages if not already on)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Publish the empire/ folder as the site root, so the app is served at
      # the repository Pages URL (e.g. https://usc513.github.io/json/).
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./empire

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
