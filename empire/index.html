<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#0b3d2e" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Empire" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon.png" />
<title>Empire</title>
<style>
  :root{
    --felt:#0b3d2e;
    --felt-2:#0e4c39;
    --gold:#e7c66b;
    --gold-dim:#b9975b;
    --cream:#f4efe1;
    --ink:#08281e;
    --danger:#c0563f;
    --radius:18px;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--cream);
    background:radial-gradient(120% 90% at 50% -10%, #12583f 0%, var(--felt) 55%, #072b20 100%);
    min-height:100%;
    -webkit-user-select:none;user-select:none;
    overflow:hidden;
  }
  .app{
    display:flex;flex-direction:column;
    height:100dvh;
    padding:calc(var(--safe-top) + 14px) 16px calc(var(--safe-bottom) + 14px);
    max-width:640px;margin:0 auto;
  }
  header{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px}
  header .crown{font-size:26px}
  header h1{
    font-size:26px;margin:0;letter-spacing:3px;font-weight:800;
    color:var(--gold);text-transform:uppercase;text-shadow:0 1px 0 rgba(0,0,0,.4);
  }
  .tag{text-align:center;font-size:13px;color:var(--gold-dim);margin:-2px 0 14px;letter-spacing:.5px}

  .screen{flex:1;min-height:0;display:flex;flex-direction:column}
  .hidden{display:none !important}

  button{font-family:inherit;cursor:pointer;border:none}
  .btn{
    border-radius:var(--radius);font-weight:700;font-size:18px;
    padding:16px 20px;color:var(--ink);background:var(--gold);
    box-shadow:0 4px 0 var(--gold-dim);transition:transform .05s, box-shadow .05s;
  }
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold-dim)}
  .btn.block{width:100%}
  .btn.big{font-size:22px;padding:22px}
  .btn.ghost{background:transparent;color:var(--gold);box-shadow:none;border:2px solid rgba(231,198,107,.4)}
  .btn[disabled]{opacity:.4;pointer-events:none}

  input[type=text]{
    width:100%;font-size:22px;padding:18px 18px;border-radius:var(--radius);
    border:2px solid rgba(231,198,107,.35);background:rgba(255,255,255,.06);
    color:var(--cream);outline:none;margin-bottom:14px;
    -webkit-user-select:text;user-select:text;
  }
  input[type=text]::placeholder{color:rgba(244,239,225,.45)}
  input[type=text]:focus{border-color:var(--gold)}

  /* ---- Collect ---- */
  #collect{justify-content:flex-start}
  .collectHint{font-size:15px;color:var(--cream);opacity:.85;margin:4px 2px 12px;line-height:1.4}
  .count{display:flex;align-items:baseline;gap:8px;margin:18px 2px 6px;justify-content:center}
  .count b{font-size:22px;color:var(--gold)}
  .count span{font-size:13px;color:var(--gold-dim)}
  .privacy{
    display:flex;align-items:center;gap:8px;justify-content:center;
    font-size:13px;color:var(--gold-dim);margin-top:2px;
  }
  .handoff{
    text-align:center;font-size:19px;color:var(--gold);font-weight:700;
    background:rgba(231,198,107,.12);border-radius:var(--radius);
    padding:18px 16px;margin:16px 0;animation:pop .25s ease;
  }
  @keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
  .spacer{flex:1;min-height:8px}
  .footRow{display:flex;gap:10px}
  .footRow .btn{flex:1}

  /* ---- Countdown ---- */
  #countdown{align-items:center;justify-content:center}
  .cdStage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .cdMsg{font-size:22px;color:var(--cream);margin-bottom:8px;font-weight:700}
  .cdSub{font-size:14px;color:var(--gold-dim);margin-bottom:18px;letter-spacing:.5px}
  .bigCount{
    font-size:150px;font-weight:800;color:var(--gold);line-height:1;
    text-shadow:0 3px 0 rgba(0,0,0,.35);transition:transform .15s, color .2s;
  }
  .bigCount.tick{transform:scale(1.12)}
  .bigCount.urgent{color:var(--danger)}
  .ring{
    width:220px;height:220px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    border:6px solid rgba(231,198,107,.18);margin-bottom:26px;position:relative;
  }

  /* ---- Reveal ---- */
  .revealTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .revealTop .step{font-size:13px;color:var(--gold-dim);letter-spacing:.5px}
  .speedRow{display:flex;align-items:center;gap:12px;margin:6px 4px 14px;font-size:14px;color:var(--gold-dim)}
  .speedRow input[type=range]{flex:1;accent-color:var(--gold)}
  .toggle{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--cream)}
  .stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px}
  .bigWord{
    font-size:52px;font-weight:800;color:var(--cream);line-height:1.1;
    word-break:break-word;overflow-wrap:anywhere;text-shadow:0 2px 0 rgba(0,0,0,.35);transition:opacity .25s;
  }
  .bigWord.gold{color:var(--gold)}
  .roundBadge{display:inline-block;margin-top:14px;font-size:13px;padding:6px 14px;border-radius:999px;background:rgba(231,198,107,.15);color:var(--gold);letter-spacing:1px}
  .progress{margin-top:10px;font-size:15px;color:var(--gold-dim);letter-spacing:1px}
  .revealControls{display:flex;gap:10px;margin-top:12px}
  .revealControls .btn{flex:1}
  .note{font-size:12px;color:var(--gold-dim);text-align:center;margin-top:8px;line-height:1.4}
</style>
</head>
<body>
<div class="app">
  <header><span class="crown">👑</span><h1>Empire</h1></header>
  <div class="tag" id="tagline">Pass the phone — everyone add a word</div>

  <!-- COLLECT (pass-and-play, words stay hidden) -->
  <section class="screen" id="collect">
    <p class="collectHint">Type <b>your</b> word, then tap <b>Done</b> and pass the phone.
       No one sees anyone else's word.</p>

    <input id="wordInput" type="text" inputmode="text" autocomplete="off" autocorrect="off"
           autocapitalize="off" spellcheck="false" placeholder="Type your word…" enterkeyhint="done" />

    <button class="btn block big" id="doneBtn">Done with my word</button>

    <div class="handoff hidden" id="handoff">✓ Got it — pass the phone 👉</div>

    <div class="count"><b id="countNum">0</b><span>words in</span></div>
    <div class="privacy">🔒 kept secret until the reading</div>

    <div class="spacer"></div>

    <div class="footRow">
      <button class="btn ghost" id="clearBtn">Clear all</button>
      <button class="btn" id="startBtn" style="flex:2" disabled>Ready to start →</button>
    </div>
  </section>

  <!-- COUNTDOWN -->
  <section class="screen hidden" id="countdown">
    <div class="cdStage">
      <div class="cdMsg">Get ready…</div>
      <div class="cdSub">reading starts automatically</div>
      <div class="ring"><div class="bigCount" id="bigCount">15</div></div>
    </div>
    <div class="revealControls">
      <button class="btn ghost" id="cancelCd">Cancel</button>
      <button class="btn" id="skipCd" style="flex:2">Skip &amp; read now →</button>
    </div>
  </section>

  <!-- REVEAL -->
  <section class="screen hidden" id="reveal">
    <div class="revealTop">
      <span class="step" id="roundLabel">Reading 1 of 2</span>
      <button class="btn ghost" id="backBtn" style="padding:8px 14px;font-size:14px">Edit words</button>
    </div>

    <div class="speedRow">
      🐢 <input type="range" id="speed" min="0.4" max="1" step="0.05" value="0.62" /> 🐇
      <label class="toggle" style="flex:none"><input type="checkbox" id="voiceOn" checked /> 🔊</label>
    </div>

    <div class="stage">
      <div class="bigWord gold" id="bigWord">Ready?</div>
      <div class="roundBadge" id="roundBadge">2 readings, scrambled order</div>
      <div class="progress" id="progress"></div>
    </div>

    <div class="revealControls">
      <button class="btn big" id="readBtn" style="flex:2">▶︎ Read Aloud</button>
      <button class="btn ghost" id="stopBtn">■ Stop</button>
    </div>
    <button class="btn ghost block" id="resetBtn" style="margin-top:10px">🔄 New game — clear all words</button>
    <div class="note" id="voiceNote"></div>
  </section>
</div>

<script>
(function(){
  "use strict";

  var words = [];
  var scrambled = [];
  var STORE = "empire_words_v1";
  try { words = JSON.parse(localStorage.getItem(STORE)) || []; } catch(e){ words = []; }
  function save(){ try{ localStorage.setItem(STORE, JSON.stringify(words)); }catch(e){} }

  var $ = function(id){ return document.getElementById(id); };
  var input = $("wordInput"), doneBtn = $("doneBtn"), handoff = $("handoff");
  var countNum = $("countNum"), startBtn = $("startBtn"), clearBtn = $("clearBtn");
  var collect = $("collect"), countdown = $("countdown"), reveal = $("reveal");
  var bigCount = $("bigCount"), cancelCd = $("cancelCd"), skipCd = $("skipCd");
  var bigWord = $("bigWord"), roundBadge = $("roundBadge"), progress = $("progress");
  var roundLabel = $("roundLabel"), readBtn = $("readBtn"), stopBtn = $("stopBtn");
  var backBtn = $("backBtn"), speed = $("speed"), voiceOn = $("voiceOn"), voiceNote = $("voiceNote");
  var resetBtn = $("resetBtn");

  var speechOK = ("speechSynthesis" in window);
  if(!speechOK){
    voiceOn.checked = false; voiceOn.disabled = true;
    voiceNote.textContent = "Voice not supported here — words still shown on screen.";
  }

  // ---------- collect (words never displayed back) ----------
  function updateCount(){
    countNum.textContent = words.length;
    startBtn.disabled = words.length < 2;
  }

  var handoffTimer = null;
  function showHandoff(){
    handoff.classList.remove("hidden");
    if(handoffTimer) clearTimeout(handoffTimer);
    handoffTimer = setTimeout(function(){ handoff.classList.add("hidden"); }, 1800);
  }

  function addWord(){
    var v = (input.value || "").trim().replace(/\s+/g," ");
    if(!v) return;
    words.push(v);
    save();
    input.value = "";
    updateCount();
    showHandoff();
    input.focus();
  }
  doneBtn.onclick = addWord;
  input.addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); addWord(); }});

  clearBtn.onclick = function(){
    if(words.length && !confirm("Clear all "+words.length+" words?")) return;
    words = []; save(); updateCount();
    handoff.classList.add("hidden");
    input.value = ""; input.focus();
  };

  // ---------- scramble ----------
  // Fisher–Yates, retried so the result is actually reordered (never the
  // same order the words were entered in, unless every word is identical).
  function shuffle(src){
    if(src.length < 2) return src.slice();
    var a;
    for(var attempt = 0; attempt < 20; attempt++){
      a = src.slice();
      for(var i = a.length - 1; i > 0; i--){
        var j = Math.floor(Math.random() * (i + 1));
        var t = a[i]; a[i] = a[j]; a[j] = t;
      }
      var same = true;
      for(var k = 0; k < a.length; k++){ if(a[k] !== src[k]){ same = false; break; } }
      if(!same) return a;
    }
    return a; // all words identical — order can't differ
  }

  // ---------- 15s countdown ----------
  var cdTimer = null;
  startBtn.onclick = function(){
    // unlock speech now (user gesture) so the auto-read after the timer can speak on iOS
    if(speechOK && voiceOn.checked){
      try{ var warm = new SpeechSynthesisUtterance(" "); warm.volume = 0; speechSynthesis.speak(warm); }catch(e){}
    }
    scrambled = shuffle(words);
    collect.classList.add("hidden");
    countdown.classList.remove("hidden");
    var n = 15;
    setCount(n);
    if(cdTimer) clearInterval(cdTimer);
    cdTimer = setInterval(function(){
      n--;
      if(n <= 0){ setCount(0); stopCountdown(); goReveal(); }
      else { setCount(n); }
    }, 1000);
  };

  function setCount(n){
    bigCount.textContent = n;
    bigCount.classList.toggle("urgent", n <= 5);
    bigCount.classList.add("tick");
    setTimeout(function(){ bigCount.classList.remove("tick"); }, 150);
  }
  function stopCountdown(){ if(cdTimer){ clearInterval(cdTimer); cdTimer = null; } }

  cancelCd.onclick = function(){
    stopCountdown();
    countdown.classList.add("hidden");
    collect.classList.remove("hidden");
  };
  skipCd.onclick = function(){ stopCountdown(); goReveal(); };

  function goReveal(){
    countdown.classList.add("hidden");
    reveal.classList.remove("hidden");
    resetReveal();
    startReading();
  }

  backBtn.onclick = function(){
    stopAll();
    reveal.classList.add("hidden");
    collect.classList.remove("hidden");
    updateCount();
  };

  // New game: clear every word and return to a fresh collect screen.
  resetBtn.onclick = function(){
    if(!confirm("Start a NEW game? This clears all words.")) return;
    stopAll();
    words = []; scrambled = [];
    save();
    reveal.classList.add("hidden");
    countdown.classList.add("hidden");
    collect.classList.remove("hidden");
    handoff.classList.add("hidden");
    input.value = "";
    updateCount();
    input.focus();
  };

  // ---------- reading (scrambled, twice, slow) ----------
  var reading = false, cancelled = false;

  function resetReveal(){
    reading = false; cancelled = false;
    bigWord.textContent = "Ready?";
    bigWord.classList.add("gold");
    roundBadge.textContent = "2 readings, scrambled order";
    progress.textContent = "";
    roundLabel.textContent = scrambled.length + " words";
    readBtn.textContent = "▶︎ Read Aloud";
    readBtn.disabled = false;
  }
  function stopAll(){
    cancelled = true; reading = false;
    stopCountdown();
    if(speechOK) try{ speechSynthesis.cancel(); }catch(e){}
  }
  stopBtn.onclick = function(){ stopAll(); resetReveal(); };

  function speak(text){
    return new Promise(function(resolve){
      if(!speechOK || !voiceOn.checked){ resolve(); return; }
      var u = new SpeechSynthesisUtterance(text);
      u.rate = parseFloat(speed.value) || 0.62; u.pitch = 1;
      u.onend = resolve; u.onerror = resolve;
      try{ speechSynthesis.speak(u); }catch(e){ resolve(); }
    });
  }
  function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
  function dwell(){ var r = parseFloat(speed.value) || 0.62; return Math.round(1500 / r); }

  async function readOnce(label){
    roundLabel.textContent = label;
    for(var i = 0; i < scrambled.length; i++){
      if(cancelled) return false;
      bigWord.classList.remove("gold");
      bigWord.textContent = scrambled[i];
      progress.textContent = "Word " + (i+1) + " of " + scrambled.length;
      await Promise.all([ speak(scrambled[i]), wait(dwell()) ]);
      if(cancelled) return false;
      await wait(250);
    }
    return true;
  }

  async function startReading(){
    if(reading) return;
    reading = true; cancelled = false;
    readBtn.textContent = "Reading…"; readBtn.disabled = true;

    var ok1 = await readOnce("Reading 1 of 2 — slowly");
    if(ok1 && !cancelled){
      bigWord.classList.add("gold");
      bigWord.textContent = "…again…";
      roundBadge.textContent = "Second reading";
      progress.textContent = "";
      await wait(1200);
      await readOnce("Reading 2 of 2 — slowly");
    }
    if(!cancelled){
      bigWord.classList.add("gold");
      bigWord.textContent = "Let the game begin! 👑";
      roundBadge.textContent = scrambled.length + " words in play";
      progress.textContent = "";
      roundLabel.textContent = "Both readings done";
    }
    readBtn.textContent = "↻ Read Again"; readBtn.disabled = false;
    reading = false;
  }
  readBtn.onclick = startReading;

  if(speechOK){
    try{ speechSynthesis.getVoices(); }catch(e){}
    speechSynthesis.onvoiceschanged = function(){ try{ speechSynthesis.getVoices(); }catch(e){} };
  }

  updateCount();
})();
</script>
</body>
</html>
